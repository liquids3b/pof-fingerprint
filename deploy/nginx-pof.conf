# Сниппет nginx: отдаёт /fingerprint наружу.
#
# 1. Установите:  sudo ./install.sh --nginx
# 2. Подключите внутри нужного server{} для вашего домена:
#       include snippets/pof-fingerprint.conf;
# 3. Проверьте и перезагрузите:  nginx -t && systemctl reload nginx
#
# Сервис слушает только 127.0.0.1 (установщик с --nginx / --local-only ставит
# это в config.json), а nginx подставляет реальный адрес клиента в X-Real-IP —
# именно его отдаёт pof-fingerprint в поле "ip".
location = /fingerprint {
    proxy_pass http://127.0.0.1:8351/fingerprint;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    # Ничего не кешируем: отпечаток зависит от того, кто именно подключился.
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    # Ключ (если он нужен) передаётся в query string как ?key=...
    # Ограничение частоты запросов, если сюда ходит публичный сайт:
    # limit_req zone=fingerprint burst=20 nodelay;
}
